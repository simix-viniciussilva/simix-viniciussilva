name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *" # Atualiza a cada 6h
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: simix-viniciussilva
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: true         # Faz commit automático
          branch: output       # Cria/atualiza branch output
          file: github-contribution-grid-snake.svg
